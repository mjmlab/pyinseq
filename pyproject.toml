[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinseq"
dynamic = ["version"]
description = "Analysis of transposon insertion sequencing (INSeq) data in Python"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "Mark J. Mandel", email = "mandel01@gmail.com" },
    { name = "Emanuel Burgos" },
    { name = "Camille Scott" },
    { name = "Loren Velasquez" },
    { name = "Benjamin K. Johnson" },
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.23",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "screed>=1.0",
    "seaborn>=0.12",
    "snakemake>=8.0",
    "tqdm>=4.61.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["pyinseq[test]", "black>=24", "pre-commit>=3"]

[project.scripts]
pyinseq = "pyinseq.cli:main"

[project.urls]
Homepage = "https://github.com/mjmlab/pyinseq"
Documentation = "https://github.com/mjmlab/pyinseq/blob/master/README.md"
Changelog = "https://github.com/mjmlab/pyinseq/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { file = "pyinseq/VERSION" }

[tool.setuptools.packages.find]
include = ["pyinseq*"]

[tool.setuptools.package-data]
pyinseq = [
    "VERSION",
    "envs/*.yaml",
    "workflows/*/Snakefile",
    "tests/data/**/*",
]

[tool.pytest.ini_options]
testpaths = ["pyinseq/tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    docs
  | private
)/
'''
